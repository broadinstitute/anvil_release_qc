[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-release-qc"
version = "0.3.6"
description = "Processes and tools for AnVIL Data Release quality control"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2",
    "requests>=2.31",
    "google-auth>=2.30",
    "google-cloud-bigquery>=3.20",
    "pyops-service-toolkit @ git+https://github.com/broadinstitute/pyops-service-toolkit.git@8af7f0369c02bee795ffc3e76dd959ba13f3bf2d#egg=pyops-service-toolkit",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pip-tools>=7"]

[project.scripts]
anvil-release-qc = "anvil_release_qc.cli:app"
qc-batch-runner = "anvil_release_qc.batch.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
