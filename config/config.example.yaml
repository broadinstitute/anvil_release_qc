# anvil-data-qc configuration — EXAMPLE / TEMPLATE.
#
# Copy this to config/config.yaml (which is gitignored) and fill in your own values:
#     cp config/config.example.yaml config/config.yaml
#
# Only per-developer settings live here. The shared, non-secret service URLs are baked into the
# package (see src/anvil_data_qc/config.py, mirroring docs/services.md), so you do not list them.

default_tier: dev

tiers:
  dev:
    # Your Google account for the DEV tier (must match the active ADC identity — enforced at runtime).
    email: you@test.firecloud.org
    # Saved ADC credentials for this tier. Create with:
    #   gcloud auth application-default login        # signed in as the dev account
    # then copy ~/.config/gcloud/application_default_credentials.json to this path.
    # Omit (or set null) to use the ambient runtime identity (e.g. in a Terra workflow).
    adc_credentials_file: ~/.config/anvil-data-qc/adc-dev.json
    # Terra billing project = the workspace namespace for created workspaces.
    billing_project: your-dev-billing-project
    # Azul personal access token (APAT) file (gitignored). Obtain via Azul's GET /user/token;
    # Azul accepts this where it rejects a plain gcloud ADC token.
    azul_apat_file: secrets/azul-apat-dev.txt

  prod:
    email: you@example.org
    adc_credentials_file: ~/.config/anvil-data-qc/adc-prod.json
    billing_project: your-prod-billing-project
    azul_apat_file: secrets/azul-apat-prod.txt
