# anvil-data-qc configuration — EXAMPLE / TEMPLATE.
#
# Copy this to config/config.yaml (which is gitignored) and fill in your own values:
#     cp config/config.example.yaml config/config.yaml
#
# Only per-developer settings live here. The shared, non-secret service URLs are baked into the
# package (see src/anvil_data_qc/config.py, mirroring docs/services.md), so you do not list them.

default_tier: dev

tiers:
  dev:
    # The human Terra user account for the DEV tier. Enforced at runtime by the identity guard, which
    # resolves the active credentials to their Terra user via Sam (/api/users/v2/self) — so in a Terra
    # workflow the runtime pet service account maps back to this human account. Use the human account
    # in every context (local and deployment), NOT a pet service account.
    email: you@test.firecloud.org
    # Optional: ADDITIONAL human Terra users authorized to run this tier (multi-operator). The identity
    # guard and the Azul-token check allow any account in {email} ∪ authorized_users; each operator
    # signs in / mints their own Azul token as themselves.
    # authorized_users:
    #   - teammate@broadinstitute.org
    # Saved ADC credentials for this tier. Create with:
    #   gcloud auth application-default login        # signed in as the dev account
    # then copy ~/.config/gcloud/application_default_credentials.json to this path.
    # Omit (or set null) to use the ambient runtime identity (e.g. in a Terra workflow).
    adc_credentials_file: ~/.config/anvil-data-qc/adc-dev.json
    # Terra billing project = the workspace namespace that ade-qc/tdr-qc create workspaces under.
    terra_billing_project: your-dev-billing-project
    # Google Cloud Project ID to run/bill Google Cloud operations against -- BigQuery jobs now, and
    # requester-pays access later. This is a REAL GCP project id: the Terra WORKSPACE Google Project ID
    # (Terra workspace dashboard -> Cloud Information -> Google Project ID, e.g. terra-xxxxxxxx), NOT the
    # Terra billing project above. (They coincide for some legacy billing projects, but not in general.)
    billing_google_project_id: terra-xxxxxxxx
    # Optional: the existing shared QC workspace that `qc-batch-runner` submits into (only that tool uses
    # it; it also accepts a --qc-workspace-name CLI override). Not needed by ade-qc/tdr-qc/compare.
    # qc_workspace_name: anvil-data-qc-shared
    # Azul access-token file (gitignored). Populate it with:  anvil-data-qc azul-login --tier dev
    # Azul needs a token issued to its own OAuth client; a plain gcloud ADC token is rejected.
    azul_token_file: secrets/azul-token-dev.txt
    # Optional: the Azul OAuth client id a token must carry (azp). Auto-discovered from Azul if unset.
    # azul_oauth2_client_id: "<client-id>.apps.googleusercontent.com"

  prod:
    email: you@example.org
    adc_credentials_file: ~/.config/anvil-data-qc/adc-prod.json
    terra_billing_project: your-prod-billing-project
    billing_google_project_id: terra-xxxxxxxx
    # qc_workspace_name: anvil-data-qc-shared   # for qc-batch-runner (optional; CLI can override)
    azul_token_file: secrets/azul-token-prod.txt
